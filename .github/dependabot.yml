version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "develop"
    reviewers:
      - "justedlev"
    assignees:
      - "justedlev"
    labels:
      - "status: review"
      - "lang: java"
    schedule:
      interval: "weekly"
    ignore:
      # Maven 3.10 adds maven-metadata-local.xml and _remote.repositories to the
      # central-publishing bundle, and Maven Central rejects it
      - dependency-name: "org.apache.maven:apache-maven"
        versions: [ ">= 3.10" ]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    reviewers:
      - "justedlev"
    assignees:
      - "justedlev"
    labels:
      - "status: review"
      - "area: ci/cd"
    schedule:
      interval: "weekly"
